name: Benchmark

# Free-runner timing for the golden + structural runners (pure CPU, stub llm —
# no provider call, no API key, no cost). The LLM-judge benchmark is NOT run
# here (it costs money); it lives in bench/judge.mjs and is run on demand.
on:
  push:
    branches: [main]
    paths: ['bench/runners.mjs', 'src/runners/**', '.github/workflows/benchmark.yml']
  pull_request:
    paths: ['bench/runners.mjs', 'src/runners/**']
  workflow_dispatch:

jobs:
  free-runners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Run free-runner timing benchmark
        run: node bench/runners.mjs | tee bench/results.txt
      - uses: actions/upload-artifact@v7
        with:
          name: free-runners
          path: bench/results.txt

  # Paid: one Claude Haiku call per judge case. Manual dispatch ONLY — never on
  # push/PR — so fork PRs can't touch the secret and the cost is opt-in. The key
  # is passed as an env secret, read from process.env, never logged.
  judge-cost:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Run LLM-judge cost benchmark (Claude Haiku)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node bench/judge.mjs | tee bench/judge-results.json
      - uses: actions/upload-artifact@v7
        with:
          name: judge-cost
          path: bench/judge-results.json
